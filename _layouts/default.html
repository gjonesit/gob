<!DOCTYPE html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
  {% include head.html %}
</head>
<body>

{% include header.html %}

<div class="outer-main-container">
  <div class="container main-container">
    <div class="main-container-inner">
      {{ content }}
    </div>
  </div>
</div>

{% include footer.html %}

<a class="btn-back-to-top" href="#" id="btt" aria-label="Torna su">
  <i class="fa fa-arrow-up" aria-hidden="true"></i>
</a>

<script>
var btt = document.getElementById('btt');
window.addEventListener('scroll', function() {
  btt.classList.toggle('vis', window.scrollY > 200);
});
document.getElementById('navToggle').addEventListener('click', function() {
  document.getElementById('navbar').classList.toggle('open');
});
document.querySelectorAll('.dropdown .nav-link, .nav-item-user .btn-user').forEach(function(el) {
  el.addEventListener('click', function(e) {
    if (window.innerWidth < 768) {
      e.preventDefault();
      this.closest('.dropdown, .nav-item-user').classList.toggle('mob-open');
    }
  });
});
</script>
</body>
</html>
