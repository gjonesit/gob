<!DOCTYPE html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
  
{% include head.html %}


<style>
*,*::before,*::after{box-sizing:border-box}
body{font:normal 16px 'Roboto Condensed',sans-serif;color:#333;background:#fff;margin:0;padding:0;text-rendering:optimizelegibility}
a,a:link,a:visited{color:#00a99d;text-decoration:none}
a:hover{color:#000;text-decoration:underline}
*:focus{outline:none!important}
.container{max-width:1140px;margin:0 auto;padding:0 15px}

/* ── HEADER TOP ── */
#header{background:#fff}
.header-top{background:#fff;border-bottom:1px solid #f0f0f0}
.header-top-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0;gap:20px;
}

/* Logo */
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;flex-shrink:0}
.logo:hover{text-decoration:none}
.logo-mark{
  width:56px;height:56px;background:#e0da10;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:900;font-size:24px;color:#333;
  flex-shrink:0;transition:background .2s,color .2s;
}
.logo:hover .logo-mark{background:#06a096;color:#fff}
.logo-text{line-height:1.3}
.logo-text .l1{
  display:block;font-family:'Playfair Display',serif;
  font-size:21px;font-weight:700;color:#111;letter-spacing:-.3px;transition:color .2s
}
.logo:hover .l1{color:#00a99d}
.logo-text .l2{
  display:block;font-size:12px;color:#999;
  font-weight:300;letter-spacing:.8px;text-transform:uppercase
}

/* Header right */
.header-right{display:flex;align-items:center;gap:0}

/* Search */
.header-search{display:flex;align-items:center;margin-right:8px}
.header-search form{display:flex;align-items:center;gap:2px}
.header-search input{
  border:none;border-bottom:1px solid #ddd;outline:none;
  font-size:15px;font-family:'Roboto Condensed',sans-serif;
  color:#555;padding:5px 4px;width:200px;background:transparent;
  transition:border-color .2s,width .25s;
}
.header-search input::placeholder{color:#bbb}
.header-search input:focus{border-color:#00a99d;width:240px}
.header-search button{
  background:none;border:none;font-size:16px;color:#aaa;
  cursor:pointer;padding:5px 8px;transition:color .15s
}
.header-search button:hover{color:#000}

/* Lingua: Italiano | Interno */
.lang-switch{
  display:flex;align-items:center;
  border-left:1px solid #ddd;padding-left:0;
}
.lang-switch a{
  font-size:16px;color:#aaa;padding:5px 14px;
  font-family:'Roboto Condensed',sans-serif;text-decoration:none;
  border-right:1px solid #ddd;transition:color .15s;white-space:nowrap;
}
.lang-switch a:last-child{border-right:none}
.lang-switch a:hover{color:#000;text-decoration:none}
.lang-switch a.active{color:#000;font-weight:700}

/* ── NAVBAR ── */
.global-menu{background:#efece8}
.navbar{display:flex;align-items:stretch;list-style:none;margin:0;padding:0}
.nav-item{position:relative}
.nav-link{
  display:flex;align-items:center;padding:12px 24px;
  font-size:18px;color:#4d4d4d;background:transparent;
  text-decoration:none;white-space:nowrap;cursor:pointer;
  border:none;font-family:'Roboto Condensed',sans-serif;gap:5px;height:100%;
}
.nav-link:hover{background:#fff;color:#000;text-decoration:none}
.nav-link.active{background:#fff;color:#000}
.caret{
  display:inline-block;width:0;height:0;
  border-top:5px dashed;border-right:5px solid transparent;border-left:5px solid transparent;
  vertical-align:middle;margin-left:2px
}
.dropdown{position:relative}
.dropdown-menu{
  display:none;position:absolute;top:100%;left:0;z-index:1000;
  background:#fff;box-shadow:0 5px 8px rgba(0,0,0,.12);
  border:none;border-radius:0;min-width:200px;
  list-style:none;padding:4px 0;margin:0
}
.dropdown:hover .dropdown-menu{display:block}
.dropdown-menu a{
  display:block;padding:8px 18px;font-size:16px;
  color:#484848;text-decoration:none
}
.dropdown-menu a:hover{background:#f5f5f5;color:#000}
.dropdown-menu a.active{font-weight:700}
.nav-item-user{margin-left:auto;position:relative}
.btn-user{
  display:flex;align-items:center;gap:6px;
  padding:12px 16px;background:transparent;border:none;
  font-size:20px;color:#4d4d4d;cursor:pointer;height:100%;
  font-family:'Roboto Condensed',sans-serif;
}
.btn-user:hover{color:#000}
.nav-item-user .dropdown-menu{right:0;left:auto}
.nav-item-user:hover .dropdown-menu{display:block}
.dropdown-menu .fa-fw{margin-right:4px;color:#aaa}

.top-hero-inner{padding:28px 0 18px}
.top-hero h4{
  font-family:'Playfair Display',serif;color:#fff;
  font-size:38px;font-weight:900;margin:0 0 6px;
  text-shadow:0 1px 5px rgba(0,0,0,.5)
}

/* ── MAIN ── */
.main-inner{padding:28px 0 60px}
.page-header{
  font-family:'Playfair Display',serif;color:#000;
  font-size:48px;font-weight:900;display:block;
  margin:6px 0 12px;line-height:1.1;border:none;padding:0
}
.section-intro{font-size:18px;color:#555;margin:0 0 24px;line-height:1.55}

/* Cards */
.card-grid{display:flex;flex-wrap:wrap;gap:20px;margin:24px 0}
.card{
  flex:1 1 260px;background:#fff;border:1px solid #e8e8e8;
  padding:22px 22px 20px;border-top:3px solid #e0da10;
  transition:box-shadow .2s
}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.09)}
.card h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#000;margin:0 0 10px}
.card p{font-size:15px;color:#555;line-height:1.55;margin:0 0 14px}
.tag{
  display:inline-block;background:#e0da10;color:#555;
  font-size:11px;font-weight:700;padding:2px 8px;
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px
}
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;font-size:13px;font-family:'Roboto Condensed',sans-serif;
  cursor:pointer;border:1px solid transparent;border-radius:0;white-space:nowrap;
}
.btn-primary{background:#e0da10;border-color:#e0da10;color:#666}
.btn-primary:hover{background:#06a096;border-color:#06a096;color:#000;text-decoration:none}

/* ── FOOTER ── */
#footer{background:#41564f;color:#fff;font-size:16px;font-weight:300;padding:30px 0 0}
#footer h6{color:#fff;font-weight:700;font-size:20px;padding-bottom:16px;margin:0}
#footer a{color:#e0da10;font-weight:400}
#footer a:hover{color:#fff;text-decoration:underline}
.footer-cols{display:flex;flex-wrap:wrap;padding-bottom:20px}
.footer-col{flex:0 0 50%;padding:0 20px 10px 0}
.footer-bottom{border-top:1px solid #4f6e66;padding:12px 0;color:#999;font-size:14px}

/* ── BACK TO TOP ── */
a.btt{
  position:fixed;bottom:0;right:20px;background:#333;color:#fff;
  border-radius:4px 4px 0 0;width:40px;height:38px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;opacity:0;pointer-events:none;
  transition:opacity .2s,background .15s;z-index:999;text-decoration:none
}
a.btt:hover{background:#65bc7b;text-decoration:none}
a.btt.vis{opacity:1;pointer-events:auto}

/* Mobile */
.nav-toggle{display:none;background:none;border:1px solid #bbb;color:#555;padding:6px 10px;cursor:pointer;font-size:20px;margin:8px 0;border-radius:0}
@media(max-width:767px){
  .nav-toggle{display:block}
  .navbar{flex-direction:column;display:none}
  .navbar.open{display:flex}
  .nav-link{font-size:18px;border-bottom:1px solid #e0ddd8}
  .nav-item-user{margin-left:0}
  .footer-col{flex:0 0 100%}
  .dropdown:hover .dropdown-menu{display:none}
  .dropdown.mopen .dropdown-menu{display:block;position:static;box-shadow:none;background:#e6e3df}
  .card-grid{flex-direction:column}
  .header-top-inner{flex-wrap:wrap;gap:12px}
  .header-search input{width:140px}
}
</style>
</head>
<body>

{% include header.html %}

<div class="outer-main">
  <div class="container">
    <div class="main-inner">
      {{ content }}
    </div>
  </div>
</div>

{% include footer.html %}

<a class="btt" href="#" id="btt" aria-label="Torna su">
  <i class="fa fa-arrow-up" aria-hidden="true"></i>
</a>

<script>
var btt = document.getElementById('btt');
window.addEventListener('scroll', function() {
  btt.classList.toggle('vis', window.scrollY > 200);
});
document.getElementById('navToggle').addEventListener('click', function() {
  document.getElementById('navbar').classList.toggle('open');
});
document.querySelectorAll('.dropdown .nav-link, .nav-item-user .btn-user').forEach(function(el) {
  el.addEventListener('click', function(e) {
    if (window.innerWidth < 768) {
      e.preventDefault();
      this.closest('.nav-item').classList.toggle('mopen');
    }
  });
});
</script>
</body>
</html>
