---
layout: default
title: Ricerca Avanzata
nav_section: ricerche
---
<h1 class="page-header">Ricerca Avanzata</h1>
<p class="search-desc">Combina più criteri di ricerca</p>

<form action="#" method="get" style="max-width:600px">
  <input type="hidden" name="search-type" value="SADV">
  {% assign campi = "Titolo,Autore,Soggetto,Editore" | split: "," %}
  {% assign nomi = "txt-Tit,txt-Aut,txt-Sog,txt-Edi" | split: "," %}
  {% for campo in campi %}
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
    <label style="width:80px;text-align:right;font-size:15px;color:#555">{{ campo }}</label>
    <input type="text" name="{{ nomi[forloop.index0] }}" class="form-control" placeholder="{{ campo }}">
  </div>
  {% endfor %}
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
    <label style="width:80px;text-align:right;font-size:15px;color:#555">Biblioteca</label>
    <select name="codbib" class="form-control">
      <option value="">Tutte le biblioteche</option>
      <option value="SFF1">Biblioteca della Filologica, sede di Udine (SFF1)</option>
      <option value="SFF2">Biblioteca della Filologica, sede di Gorizia (SFF2)</option>
    </select>
  </div>
  <div style="display:flex;gap:16px;align-items:center;margin-top:18px;padding-left:96px">
    <button class="btn btn-primary" type="submit"><i class="fa fa-search"></i> Cerca</button>
  </div>
</form>
